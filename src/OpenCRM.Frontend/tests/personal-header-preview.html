<!doctype html><html lang="ru" data-crm-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCRM — шапки личного кабинета</title><style>body{margin:0;font:14px/1.5 system-ui,sans-serif}.card{border:1px solid var(--crm-line);border-radius:10px;background:var(--crm-surface);overflow:hidden}.card-header{padding:14px 18px}.card-body{padding:20px}.card-title{margin:0;font-size:17px}button{padding:8px 12px;border:1px solid var(--crm-line);border-radius:6px;color:var(--crm-text);background:var(--crm-surface)}.personal-page .personal-shell{grid-template-columns:1fr;max-width:1100px}</style></head><body class="organizations-entry personal-page personal-vehicles"><main><div class="personal-shell personal-shell--single"><div class="personal-content"><header class="personal-heading"><h1>Профиль</h1><button id="theme-toggle">Тема</button></header><div class="personal-grid"><section class="profile-card"><h2>Личные данные</h2><dl class="personal-details"><div><dt>Имя</dt><dd>Демонстрационный пользователь</dd></div><div><dt>Email</dt><dd>contact@example.invalid</dd></div></dl></section><section class="profile-card"><div class="personal-card-heading"><h2>Связанные аккаунты</h2></div><p class="personal-muted">Внешние способы входа.</p></section></div><div id="maintenance-details-form" style="margin-top:20px"><section class="card"><header class="card-header"><h2 class="card-title">Информация о работе</h2></header><div class="card-body">Демонстрация оформления заголовка личной техники.</div></section></div></div></div></main><script type="module">
import '../../OpenCRM.WebApp/wwwroot/css/organizations-entry.css';
import '../../OpenCRM.WebApp/wwwroot/css/personal.css';
import '../../OpenCRM.WebApp/wwwroot/css/personal-vehicles.css';
const button=document.getElementById('theme-toggle');button.onclick=()=>{document.documentElement.dataset.crmTheme=document.documentElement.dataset.crmTheme==='dark'?'light':'dark';};
</script></body></html>
